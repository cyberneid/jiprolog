name: build

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
        os: [ubuntu-latest]
        include:
          # One Windows run: the build shells out to a second JVM to compile the
          # Prolog libraries (see pom.xml), which is the part most likely to be
          # platform-sensitive.
          - java: '21'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, bootstrap the Prolog libraries, and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}-${{ matrix.os }}
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload the jar
        if: matrix.java == '21' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jiprolog-jar
          path: target/jiprolog-*.jar
          retention-days: 14

  # maven.compiler.release is 8, so the jar is meant to run on a Java 8 runtime.
  # The build itself cannot run there (maven-compiler-plugin needs 9+ for
  # --release), so the claim is checked separately: take the jar built above and
  # actually run a goal with it under JDK 8.
  run-on-java-8:
    name: run the jar on JDK 8
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jiprolog-jar

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Run a goal against the packaged jar
        run: |
          cat > smoke.pl <<'PROLOG'
          smoke :-
              append([a], [b], L), write(L), nl,
              X is 6 * 7, write(X), nl,
              findall(N, between(1, 3, N), Ns), write(Ns), nl,
              ( L == [a,b], X == 42, Ns == [1,2,3] -> halt(0) ; halt(1) ).
          PROLOG
          java -jar jiprolog-*.jar -c smoke.pl -g smoke
